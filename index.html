<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover lets the page paint under the notch / dynamic island
         instead of being letterboxed by black bars; safe-area insets in the CSS
         keep the header and clock out of the hardware's way. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000" />
    <title>ophelierosier</title>
    <meta name="description" content="ophelierosier — full-stack development, automation and visuals: TouchDesigner, Figma, After Effects." />

    <!-- The ?v= is not decoration. A browser holds on to a favicon far longer
         and far more stubbornly than to anything else on the page, so replacing
         the file at the same address leaves the old icon sitting in the tab for
         hours. Changing the address is the only reliable way to say "this is a
         different icon"; bump the number whenever the artwork changes. -->
    <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
    <link rel="icon" href="/icon-32.png?v=2" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/icon-180.png?v=2" />

    <!-- Link previews. Absolute URLs on purpose: Telegram and Slack resolve a
         relative og:image against the page, but X/Twitter does not, and the
         crawlers that get it wrong fail silently — the card just shows up bare.
         The domain is live, so there is no reason to leave that to chance. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ophelierosier" />
    <meta property="og:url" content="https://ophelierosier.press/" />
    <meta property="og:title" content="ophelierosier" />
    <meta property="og:description" content="Full-stack development, automation and visuals: TouchDesigner, Figma, After Effects." />
    <meta property="og:image" content="https://ophelierosier.press/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ophelierosier" />
    <meta name="twitter:description" content="Full-stack development, automation and visuals: TouchDesigner, Figma, After Effects." />
    <meta name="twitter:image" content="https://ophelierosier.press/og.jpg" />
    <script type="module" crossorigin src="/assets/index-CUnB9za3.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-I3-0a82f.css">
    <link rel="canonical" href="https://ophelierosier.press/" />
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
